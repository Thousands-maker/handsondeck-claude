name: Publish site

# Publishes HandsOnDeck to GitHub Pages, together with the optional Supercharged model.
# The model is fetched here, on GitHub's servers, checked, and published on this same
# site, so people using the app only ever download from this site.
#
# One-time setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# To swap the model, edit "model" in supercharged.json and commit.
# Supercharged Pro (the "pro" block) is not copied here: its manifest pins Mistral's
# official Hugging Face files by commit and fingerprint, and people download from there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the chosen model
        run: echo "MODEL_ID=$(node -p "require('./supercharged.json').model")" >> "$GITHUB_ENV"

      - name: Install the engine and bundler (build time only)
        run: npm install --no-save --no-package-lock --no-audit --no-fund @mlc-ai/web-llm@0.2 @huggingface/transformers@3 esbuild@0.25

      - name: Reuse model files from earlier builds
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-${{ env.MODEL_ID }}-${{ hashFiles('tools/prepare-model.mjs') }}
          restore-keys: model-${{ env.MODEL_ID }}-

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest icon.svg .nojekyll _site/
          node tools/prepare-model.mjs _site
          node tools/prepare-pro.mjs _site
          echo "{\"commit\":\"${GITHUB_SHA::7}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%MZ)\"}" > _site/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
